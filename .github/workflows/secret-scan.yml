name: Secret scan (reusable)

# Playbook Gate 3 "secrets". gitleaks over the commits a PR adds (or the whole history on push).
# Call with:  uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/secret-scan.yml@v1

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.30.1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the binary directly (gitleaks-action needs a license for organizations) and verify its checksum.
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt   "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" checksums.txt \
            | sed 's/  .*/  gitleaks.tar.gz/' | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks

      # Refs go through env, never straight into the script, so a hostile branch name can't inject shell.
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ]; then
            ./gitleaks git . --redact --no-banner --verbose --log-opts="${BASE_SHA}..HEAD"
          else
            ./gitleaks git . --redact --no-banner --verbose
          fi
