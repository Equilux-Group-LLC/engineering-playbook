name: Verify (reusable)

# Playbook Gate 3 "verify" + "coverage". Installs the toolchain, runs the repo's `verify` contract command
# (Part 7) through whatever task runner the repo uses, then applies the coverage ratchet and the
# changed-line coverage threshold.
# Call with:  uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/verify.yml@v1
#
# Toolchain: pin versions in mise.toml or .tool-versions (any language). Without them, Node (package.json),
# Python (pyproject.toml / requirements.txt) and Go (go.mod) are detected.
#
# Runner: `runs-on` takes JSON so a caller can pick a label list, for example a self-hosted Mac for Xcode:
#   with:
#     runs-on: '["self-hosted","macOS","ARM64","ios"]'
#
# Skips (issue #18): a pull request whose changed paths all match `docs-pattern` (and none `docs-exclude-pattern`),
# or a draft when `skip-drafts: true`, still gets a green `verify` check, but on ubuntu-latest and without the
# build, tests or coverage steps. Never filter the caller's trigger with `paths` / `paths-ignore` instead: a
# required check whose workflow never starts stays "Expected" and blocks the merge. With `skip-drafts: true`,
# add `ready_for_review` to the caller's `pull_request.types` so marking the PR ready runs the full verify.

on:
  workflow_call:
    inputs:
      verify-command:
        description: Contract command to run.
        type: string
        default: verify
      setup-command:
        description: Shell command to install dependencies. Empty = auto-detect.
        type: string
        default: ""
      coverage-report:
        description: Path to an LCOV or Cobertura report written by verify. Empty = skip coverage gates.
        type: string
        default: ""
      changed-line-coverage:
        description: Minimum % of changed, instrumented lines that tests must execute. 0 = off.
        type: number
        default: 80
      toolkit-ref:
        description: Ref of Equilux-Group-LLC/engineering-playbook whose scripts to use. Keep equal to the @ref you call.
        type: string
        default: v1
      timeout-minutes:
        type: number
        default: 15
      runs-on:
        description: >-
          Runner labels as a JSON string, read with fromJSON: a single label ('"ubuntu-latest"') or a list
          ('["self-hosted","macOS","ARM64","ios"]' for an iOS repo on a self-hosted Mac).
        type: string
        default: '"ubuntu-latest"'
      docs-pattern:
        description: >-
          Extended regex. A pull request whose changed paths all match it skips the build, tests and coverage
          and still reports success. Empty = never skip for docs.
        type: string
        default: '^(docs/|.*\.md$)'
      docs-exclude-pattern:
        description: >-
          Extended regex for docs paths that verify reads (for example '^docs/recipes/'): changing one runs the
          full verify. Empty = no exceptions.
        type: string
        default: ""
      skip-drafts:
        description: Skip the build, tests and coverage on draft pull requests. Add ready_for_review to the caller's types.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Decide what verify runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # A pull_request event checks out the test merge commit, whose first parent is the base branch, so the
      # diff between them is exactly what merging the PR changes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          path: repo

      - name: Check out harness toolkit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Equilux-Group-LLC/engineering-playbook
          ref: ${{ inputs.toolkit-ref }}
          path: .harness-toolkit
          sparse-checkout: scripts/verify-skip.sh
          sparse-checkout-cone-mode: false

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SKIP_DRAFTS: ${{ inputs.skip-drafts }}
          DOCS_PATTERN: ${{ inputs.docs-pattern }}
          DOCS_EXCLUDE_PATTERN: ${{ inputs.docs-exclude-pattern }}
        run: |
          # No second parent means HEAD is not a PR merge commit: list nothing, which runs the full verify.
          if git -C repo rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git -C repo diff --name-only --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          bash .harness-toolkit/scripts/verify-skip.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify (build / lint / types / tests / coverage)
    needs: changes
    # Runs even if `changes` failed; then SKIP is empty and the full verify runs. Never skip on an error.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.changes.outputs.skip == 'true' && '"ubuntu-latest"' || inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SKIP: ${{ needs.changes.outputs.skip }}
    steps:
      - name: Verify skipped
        if: env.SKIP == 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "$REASON"
          echo "Verify skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"

      - if: env.SKIP != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out harness toolkit
        if: env.SKIP != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Equilux-Group-LLC/engineering-playbook
          ref: ${{ inputs.toolkit-ref }}
          path: .harness-toolkit

      - name: Detect toolchain
        if: env.SKIP != 'true'
        id: tc
        run: |
          has() { [ -e "$1" ]; }
          if has mise.toml || has .mise.toml || has .tool-versions; then echo "mise=true" >> "$GITHUB_OUTPUT"; fi
          if has package.json; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            if   has pnpm-lock.yaml;    then echo "pm=pnpm" >> "$GITHUB_OUTPUT"; echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            elif has yarn.lock;         then echo "pm=yarn" >> "$GITHUB_OUTPUT"; echo "cache=yarn" >> "$GITHUB_OUTPUT"
            elif has package-lock.json; then echo "pm=npm"  >> "$GITHUB_OUTPUT"; echo "cache=npm"  >> "$GITHUB_OUTPUT"
            else                             echo "pm=npm"  >> "$GITHUB_OUTPUT"; fi
            if   has .nvmrc;         then echo "node-file=.nvmrc" >> "$GITHUB_OUTPUT"
            elif has .node-version;  then echo "node-file=.node-version" >> "$GITHUB_OUTPUT"; fi
          fi
          if has pyproject.toml || has requirements.txt; then echo "python=true" >> "$GITHUB_OUTPUT"; fi
          if has go.mod; then echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up tools (mise)
        if: env.SKIP != 'true' && steps.tc.outputs.mise == 'true'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Set up pnpm
        if: env.SKIP != 'true' && steps.tc.outputs.mise != 'true' && steps.tc.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        if: env.SKIP != 'true' && steps.tc.outputs.mise != 'true' && steps.tc.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ steps.tc.outputs.node-file }}
          node-version: ${{ steps.tc.outputs.node-file == '' && '22' || '' }}
          cache: ${{ steps.tc.outputs.cache }}

      - name: Set up Python
        if: env.SKIP != 'true' && steps.tc.outputs.mise != 'true' && steps.tc.outputs.python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Go
        if: env.SKIP != 'true' && steps.tc.outputs.mise != 'true' && steps.tc.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        if: env.SKIP != 'true'
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
          PM: ${{ steps.tc.outputs.pm }}
        run: |
          if [ -n "$SETUP_COMMAND" ]; then bash -c "$SETUP_COMMAND"; exit; fi
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
          esac
          if   [ -f uv.lock ];          then pip install uv && uv sync --frozen
          elif [ -f requirements.txt ]; then pip install -r requirements.txt
          elif [ -f pyproject.toml ];   then pip install -e ".[dev]" 2>/dev/null || pip install -e .
          fi
          if [ -f go.mod ]; then go mod download; fi

      - name: Run verify
        if: env.SKIP != 'true'
        env:
          CI: "true"
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: bash .harness-toolkit/scripts/run-contract.sh "$VERIFY_COMMAND"

      - name: Coverage ratchet
        if: env.SKIP != 'true' && inputs.coverage-report != ''
        env:
          REPORT: ${{ inputs.coverage-report }}
        run: python3 .harness-toolkit/scripts/coverage-ratchet.py "$REPORT"

      - name: Changed-line coverage
        if: env.SKIP != 'true' && inputs.coverage-report != '' && inputs.changed-line-coverage > 0 && github.event_name == 'pull_request'
        env:
          REPORT: ${{ inputs.coverage-report }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THRESHOLD: ${{ inputs.changed-line-coverage }}
        run: python3 .harness-toolkit/scripts/diff-coverage.py "$REPORT" "$BASE_SHA" --fail-under "$THRESHOLD"
