name: Conformance (reusable)

# Checks that the calling repository keeps the harness's structure: verify and verify:fast resolve through
# run-contract.sh, the invariant catalog parses, AGENTS.md has the testing block, the AI review is called at
# @v1, and .equilux.yml names the versions. Nothing in the repository is run.
# Call with:  uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/conformance.yml@v1

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Ref of Equilux-Group-LLC/engineering-playbook whose scripts to use. Keep equal to the @ref you call.
        type: string
        default: v1

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (harness structure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out harness toolkit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Equilux-Group-LLC/engineering-playbook
          ref: ${{ inputs.toolkit-ref }}
          path: .harness-toolkit

      - name: Set up tools (mise)
        if: hashFiles('mise.toml', '.mise.toml', '.tool-versions') != ''
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Check conformance
        run: bash .harness-toolkit/scripts/check-conformance.sh .
