<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Equilux">
  <title>Equilux</title>
  <!-- navy-900 field (reversed lockup ground) -->
  <rect width="64" height="64" fill="#0E2238"/>
  <!-- the custom gold X: two crossing rounded bars -->
  <g fill="none" stroke="#D9A441" stroke-width="8" stroke-linecap="round">
    <path d="M19 15 L45 41"/>
    <path d="M45 15 L19 41"/>
  </g>
  <!-- rule + fulcrum dot: the "equal" balance point -->
  <line x1="15" y1="51" x2="49" y2="51" stroke="#F7F5F1" stroke-width="2"/>
  <circle cx="32" cy="51" r="3.5" fill="#D9A441"/>
</svg>
