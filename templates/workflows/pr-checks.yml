name: PR Checks

# Testing harness playbook, Gate 3. Calls the shared Equilux workflows; keep the @ref and toolkit-ref equal.
# Make these checks required with a branch ruleset where your plan allows (playbook Part 6).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/secret-scan.yml@v1

  verify:
    uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/verify.yml@v1
    with:
      toolkit-ref: v1
      # Path your `verify` command writes coverage to (LCOV or Cobertura). Delete the line to skip coverage gates.
      coverage-report: coverage/lcov.info
      changed-line-coverage: 80

  review:
    # Drafts, Dependabot and fork PRs have no access to secrets; they are reviewed once marked ready.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/ai-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
