name: PR Checks

# Testing harness playbook, Gate 3. Calls the shared Equilux workflows; keep the @ref and toolkit-ref equal.
# Runs only when the code changes; the AI review is in PR Review so marking a draft ready re-runs only that.
# Make these checks required with a branch ruleset where your plan allows (playbook Part 6).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/secret-scan.yml@v1

  verify:
    uses: Equilux-Group-LLC/engineering-playbook/.github/workflows/verify.yml@v1
    with:
      toolkit-ref: v1
      # Path your `verify` command writes coverage to (LCOV or Cobertura). Delete the line to skip coverage gates.
      coverage-report: coverage/lcov.info
      changed-line-coverage: 80
